name: TokenPace
options:
  bundleIdPrefix: io.github.citizenyolo
targets:
  TokenPace:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: 
      - Sources/TokenPace
      - Sources/Shared
    settings:
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
      DEVELOPMENT_TEAM: ""
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      CODE_SIGN_ENTITLEMENTS: Entitlements.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TOKENPACE_SOURCE_REVISION: unversioned
    info:
      path: Info.plist
      properties:
        LSUIElement: YES
        TokenPaceSourceRevision: $(TOKENPACE_SOURCE_REVISION)
    entitlements:
      path: Entitlements.entitlements
    dependencies:
      - target: TokenPaceExtension
        embed: true
  TokenPaceExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources: 
      - Sources/TokenPaceExtension
      - Sources/Shared
    settings:
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
      DEVELOPMENT_TEAM: ""
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      CODE_SIGN_ENTITLEMENTS: ExtensionEntitlements.entitlements
      TOKENPACE_SOURCE_REVISION: unversioned
    info:
      path: ExtensionInfo.plist
      properties:
        TokenPaceSourceRevision: $(TOKENPACE_SOURCE_REVISION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ExtensionEntitlements.entitlements
      properties:
        com.apple.security.app-sandbox: true
